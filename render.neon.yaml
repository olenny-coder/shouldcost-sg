# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# ---------------------------------------------------------------------------
# shouldcost - Render Blueprint, NEON VARIANT.
#
# Use this INSTEAD of render.yaml when your PostgreSQL lives on Neon.
#
# Why: render.yaml provisions a free Render PostgreSQL, and Render DELETES free
# databases after 30 days. Neon's free plan does not expire - an idle project
# suspends compute and wakes on the next query, so nothing is lost.
#
# How to use it:
#   1. Delete or rename render.yaml, then rename this file to render.yaml.
#   2. Commit and push.
#   3. Render -> New -> Blueprint -> pick the repo.
#   4. When Render prompts for DATABASE_URL, paste your Neon connection string.
#
# There is no databases: block here on purpose. If one exists for the same
# service, Render injects its own DATABASE_URL and silently overwrites yours.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: shouldcost-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/healthz
    envVars:
      # Paste the Neon connection string here when Render prompts. It is
      # normalised in app/config.py, so postgres:// and postgresql:// both work,
      # and any ?sslmode=... query string is preserved.
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Set this AFTER the Vercel deploy exists, to the Vercel production URL.
      # With no FRONTEND_URL in production the CORS allowlist is empty on
      # purpose, so the API answers nothing until this is set.
      - key: FRONTEND_URL
        sync: false
      # Optional: allow Vercel preview deployments, e.g.
      # ^https://shouldcost-.*\.vercel\.app$
      - key: FRONTEND_PREVIEW_REGEX
        sync: false
